<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecodes | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <aside class="login-visual">
        <div class="login-overlay"></div>
        <div class="login-copy">
          <span class="eyebrow">Ecodes</span>
          <h1>Conectamos desarrollo y naturaleza.</h1>
          <p>
            Impulsamos proyectos ambientales con enfoque territorial, técnico y sostenible en Colombia,
            Perú y Argentina.
          </p>
        </div>
      </aside>
      <main class="login-card-wrap">
        <div class="login-card">
          <div class="brand brand-logo-card">
            <img src="/static/images/ecodes_ingenieria_ltda_logo.jpg" alt="Ecodes" class="ecodes-logo" />
          </div>

          <h2>Acceso al sistema</h2>
          <p class="login-subtitle">Ingresa tu correo y contraseña</p>

          <form id="loginForm" class="login-form">
            <label for="role">Rol</label>
            <select id="role" name="role">
              <option value="Talento Humano">Talento Humano</option>
              <option value="Administrativo">Administrativo</option>
            </select>

            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" value="juans.lagosv@gmail.com" />

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" value="ecodes123" />

            <button type="submit">Ingresar</button>
          </form>
          <div id="loginError" class="login-error"></div>
          <div id="loginInfo" class="login-info"></div>
        </div>
      </main>
    </div>
    <script src="/static/js/app.js"></script>
  </body>
</html>
