# Despliegue del backend en Render (https://render.com)
#
# Cómo usarlo:
#   1. En Render: New > Blueprint, y conecta este repositorio.
#   2. Render lee este archivo y crea el servicio web y la base de datos.
#   3. Los datos de ejemplo (incluidas las empresas Ecodes y Envsol) se
#      cargan solos la primera vez que la base está vacía; el buildCommand
#      de abajo se encarga (ver el modo --solo-si-vacia en app/seed.py).
#      No hace falta la pestaña "Shell", que el plan gratuito no incluye.
#   4. Copia la URL del servicio y pégala en frontend/js/config.js.
#
# Si el modelo cambia (columnas o tablas nuevas) después de que la base ya
# tenga información, --solo-si-vacia no las agrega: create_all() no altera
# tablas existentes. Se resuelve con SEED_RESET=1 (ver la sección 11 del
# README) — borra y recarga todo, así que solo mientras sean datos de
# ejemplo.

databases:
  - name: ecodes-th-db
    databaseName: ecodes_th
    user: ecodes
    plan: free

services:
  - type: web
    name: ecodes-th-api
    runtime: python
    plan: free
    rootDir: backend
    # La siembra corre en cada despliegue, pero --solo-si-vacia hace que no
    # toque nada si la base ya tiene información. Así no hace falta la
    # pestaña Shell, que el plan gratuito de Render no incluye.
    buildCommand: pip install -r requirements.txt && python -m app.seed --solo-si-vacia
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: ecodes-th-db
          property: connectionString
      # Render genera una clave aleatoria la primera vez y la conserva.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      # Acepta cualquier dominio de Vercel, incluidas las URLs de vista
      # previa que se crean en cada despliegue del frontend.
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: CORS_ORIGINS
        value: http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080
      # Datos de la PRIMERA empresa (Ecodes) que se crea al sembrar la base
      # vacía. Después de esa primera vez, tanto Ecodes como Envsol (o
      # cualquier otra) se administran desde la propia aplicación —
      # Empleados > Empresas — y estas variables ya no se usan.
      # sync: false hace que Render las pida en el panel, sin guardarlas en
      # el repositorio.
      - key: EMPRESA_NOMBRE
        value: ECODES INGENIERÍA S.A.S.
      - key: EMPRESA_NIT
        sync: false
      - key: EMPRESA_CIUDAD
        value: Bogotá D.C.
      - key: FIRMANTE_NOMBRE
        sync: false
      - key: FIRMANTE_CARGO
        value: Directora de Talento Humano
