<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe8c4"/>
      <stop offset="55%" stop-color="#a9d1a0"/>
      <stop offset="100%" stop-color="#7fb877"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f9a55"/>
      <stop offset="100%" stop-color="#4a7c3c"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f7233"/>
      <stop offset="100%" stop-color="#2c6b24"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c5b28"/>
      <stop offset="100%" stop-color="#1f4520"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1260" cy="180" r="120" fill="#eaf6cf" opacity="0.55"/>

  <!-- colinas -->
  <path d="M0 480 C260 400 520 430 800 470 C1080 510 1340 420 1600 460 L1600 1000 L0 1000 Z" fill="url(#hillBack)"/>
  <path d="M0 600 C300 520 560 590 860 560 C1140 535 1360 610 1600 570 L1600 1000 L0 1000 Z" fill="url(#hillMid)"/>
  <path d="M0 760 C280 700 620 760 900 720 C1180 685 1400 760 1600 730 L1600 1000 L0 1000 Z" fill="url(#hillFront)"/>

  <!-- árboles dispersos -->
  <g fill="#274d24" opacity="0.9">
    <ellipse cx="180" cy="560" rx="34" ry="46"/>
    <ellipse cx="230" cy="580" rx="26" ry="36"/>
    <ellipse cx="1420" cy="540" rx="38" ry="50"/>
    <ellipse cx="1470" cy="565" rx="24" ry="34"/>
    <ellipse cx="120" cy="610" rx="22" ry="30"/>
  </g>
  <g fill="#1e3d1e">
    <ellipse cx="980" cy="640" rx="30" ry="42"/>
    <ellipse cx="1040" cy="660" rx="22" ry="32"/>
    <ellipse cx="60" cy="700" rx="30" ry="40"/>
  </g>

  <!-- personas plantando (siluetas) -->
  <g fill="#16241a" opacity="0.92">
    <!-- persona 1: agachada plantando -->
    <path d="M420 830 q10 -40 40 -46 q8 -18 26 -18 q18 0 22 16 q16 6 18 26 l-4 40 q-4 14 -20 14 l-70 0 q-16 0 -12 -32 Z"/>
    <rect x="452" y="758" width="10" height="34" rx="4"/>
    <circle cx="457" cy="748" r="13"/>
    <path d="M486 792 l34 34" stroke="#16241a" stroke-width="8" stroke-linecap="round"/>

    <!-- persona 2: de pie con pala -->
    <path d="M700 700 q-4 -20 14 -22 l4 -14 q3 -10 14 -10 q11 0 14 10 l4 14 q18 2 16 22 l-6 96 q-2 14 -16 14 l-30 0 q-14 0 -14 -14 Z"/>
    <circle cx="725" cy="642" r="13"/>
    <path d="M712 720 l-26 66" stroke="#16241a" stroke-width="8" stroke-linecap="round"/>
    <path d="M686 786 l-20 26" stroke="#3a2a18" stroke-width="7" stroke-linecap="round"/>
    <path d="M660 800 l40 -18" stroke="#8a6a3c" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- plántulas -->
  <g stroke="#2c6b24" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M540 860 q0 -20 -8 -30"/>
    <path d="M540 860 q0 -20 10 -28"/>
    <path d="M860 840 q0 -18 -7 -26"/>
    <path d="M860 840 q0 -18 9 -24"/>
  </g>

  <rect width="1600" height="1000" fill="#0b1a10" opacity="0.06"/>
</svg>
