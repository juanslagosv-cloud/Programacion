<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novedades · Ecodes Talento Humano</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div id="topbar-slot"></div>

    <main class="main page-enter">
      <div class="flex-between mb-18" style="flex-wrap:wrap; gap:12px;">
        <div class="filters-bar" style="margin-bottom:0;">
          <select id="f-tipo">
            <option value="">Todos los tipos</option>
            <option value="Ingreso">Ingreso</option>
            <option value="Salida">Salida</option>
            <option value="Cambio de proyecto">Cambio de proyecto</option>
            <option value="Incapacidad">Incapacidad</option>
            <option value="Otro">Otro</option>
          </select>
          <select id="f-procesada">
            <option value="">Todas</option>
            <option value="false">Sin procesar</option>
            <option value="true">Procesadas</option>
          </select>
        </div>
        <button class="btn btn-primary write-only" id="btn-nueva-novedad">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Registrar novedad
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Empleado</th>
              <th>Tipo</th>
              <th>Proyecto</th>
              <th>Fecha</th>
              <th>Detalle</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="novedades-tbody">
            <tr><td colspan="7" class="table-empty">Cargando novedades…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/novedades.js"></script>
</body>
</html>
