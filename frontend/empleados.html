<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empleados · Ecodes Talento Humano</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-slot"></div>
    <div id="topbar-slot"></div>

    <main class="main page-enter">
      <div id="birthday-widget"></div>

      <div class="flex-between mb-18" style="flex-wrap:wrap; gap:12px;">
        <div class="filters-bar" style="margin-bottom:0;">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="f-buscar" placeholder="Buscar por nombre...">
          </div>
          <select id="f-estado">
            <option value="">Todos los estados</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
          </select>
          <select id="f-proyecto">
            <option value="">Todos los proyectos</option>
          </select>
          <select id="f-tipo-cargo">
            <option value="">Todos los cargos</option>
            <option value="Profesional">Profesional</option>
            <option value="Técnico">Técnico</option>
            <option value="Operario">Operario</option>
            <option value="Administrativo">Administrativo</option>
          </select>
        </div>
        <button class="btn btn-primary write-only" id="btn-nuevo-empleado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Agregar empleado
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Empleado</th>
              <th>Cargo</th>
              <th>Tipo</th>
              <th>Proyecto(s)</th>
              <th>% Participación</th>
              <th>Antigüedad</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="empleados-tbody">
            <tr><td colspan="7" class="table-empty">Cargando empleados…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/empleados.js"></script>
</body>
</html>
